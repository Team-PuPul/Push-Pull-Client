name: Unity CI — Desktop Build

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch: {}

env:
  UNITY_VERSION: auto

jobs:
  build:
    name: build (${{ matrix.targetPlatform }}, ${{ matrix.buildName }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            buildName: "Push&Pull"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build ${{ matrix.buildName }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ matrix.buildName }}
          buildsPath: builds
          versioning: Semantic

      - name: Create steam_appid.txt
        shell: pwsh
        run: |
          # 480은 테스트용 ID입니다. 실제 ID가 있다면 수정하세요.
          $buildPath = "steam_appid.txt"
          echo "480" > $buildPath
          Write-Host "Created steam_appid.txt at $buildPath"

      - name: Prepare artifact
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/artifact"
          mkdir -p "${RUNNER_TEMP}/artifact/${{ matrix.buildName }}"
          cp -a "builds/${{ matrix.targetPlatform }}/." "${RUNNER_TEMP}/artifact/${{ matrix.buildName }}/"
          cp steam_appid.txt "${RUNNER_TEMP}/artifact/${{ matrix.buildName }}/steam_appid.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.buildName }}
          path: ${{ runner.temp }}/artifact
          retention-days: 14
