name: Unity CI — Desktop Build

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

env:
  UNITY_VERSION: auto

jobs:
  build:
    name: build (${{ matrix.targetPlatform }}, ${{ matrix.buildName }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            buildName: Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build ${{ matrix.buildName }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: ${{ matrix.buildName }}
          buildsPath: builds
          versioning: Semantic
          customParameters: -logFile /github/workspace/unity-build.log

      - name: Upload Unity build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Build-Log-${{ github.sha }}
          path: unity-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Zip build output
        run: |
          cd builds
          zip -r ${{ matrix.buildName }}.zip ${{ matrix.targetPlatform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.buildName }}-${{ github.sha }}
          path: builds/${{ matrix.buildName }}.zip
          retention-days: 14
